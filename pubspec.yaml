name: nitmgpt
version: 0.0.1-alpha.2
publish_to: none
description: It's a watcher client for Android that auto-hide ads, spam, etc notifications via chatgpt.
environment:
  sdk: ^3.0.0

dependencies:
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.0
  permission_handler: ^12.0.3
  flutter_notification_listener:
    path: plugins/flutter_notification_listener
  fluttertoast: ^9.1.0
  flutter_screenutil: ^5.9.3
  unicons: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  installed_apps: ^1.6.0
  disable_battery_optimization: ^1.1.2
  syncfusion_flutter_xlsio: ^33.2.12
  path_provider: ^2.1.5
  flutter_archive: ^6.0.4
  package_info_plus: ^10.1.0
  system_info2: ^4.1.0
  version: ^3.0.2
  ota_update: ^7.1.0
  flutter_markdown_plus: ^1.0.3
  markdown: ^7.3.1
  chat_gpt_sdk:
    path: plugins/chatgpt_api
  flutter_chatgpt_api:
    path: plugins/chatgpt_api_unofficial
  flutter_foreground_task: ^9.2.2
  realm: ^20.2.0
  intl: ^0.20.2
  bubble_tab_indicator: ^0.1.6
  tab_indicator_styler: ^2.0.0
  signals: ^7.1.0
  http: ^1.6.0
  collection: ^1.19.1
  signals_flutter: ^7.1.0
  go_router: ^17.3.0
  liquid_glass_widgets: ^0.16.0

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  realm_generator: ^20.2.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
